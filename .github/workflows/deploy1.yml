
name: Deploy React App to Hostinger via FTP

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  web-deploy:
    name: Build and Deploy to Hostinger
    runs-on: ubuntu-latest

    steps:
      # Get latest code
      - name: Get latest code
        uses: actions/checkout@v4

      # Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Install dependencies
      - name: Install Dependencies
        run: npm ci

      # Build React Application
      - name: Build React App
        env:
          VITE_YOUTUBE_API_KEY: ${{ secrets.VITE_YOUTUBE_API_KEY }}
          VITE_YOUTUBE_CHANNEL_ID: ${{ secrets.VITE_YOUTUBE_CHANNEL_ID }}
        run: npm run build

      # Verify Generated HTML
      - name: Verify Generated HTML
        run: |
          echo "Checking generated HTML files..."
          find dist -name "index.html" -type f
          test -f dist/index.html

      # Verify SEO Pages
      - name: Verify Static SEO Pages
        run: |
          echo "Checking static SEO pages..."

          test -f dist/index.html

          if [ -d dist/blogs ]; then
            find dist/blogs -name "index.html" -type f
          fi

          if [ -d dist/news ]; then
            find dist/news -name "index.html" -type f
          fi

          echo "Static SEO verification completed."

      # Deploy to Hostinger via FTP
      - name: Deploy to Hostinger
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: 145.223.17.63
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: /
          local-dir: ./dist/
          protocol: ftp
          port: 21

      # Deployment completed
      - name: Deployment Success
        run: echo "Website successfully deployed to Hostinger!"
