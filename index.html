  <!-- Google Tag Manager + Google Analytics -->
  <!-- Skip analytics during React Snap prerendering -->
  <script>
    (function () {
      var isPrerendering =
        /ReactSnap|HeadlessChrome/i.test(navigator.userAgent);

      if (isPrerendering) {
        return;
      }

      // Google Tag Manager
      (function (w, d, s, l, i) {
        w[l] = w[l] || [];

        w[l].push({
          "gtm.start": new Date().getTime(),
          event: "gtm.js"
        });

        var f = d.getElementsByTagName(s)[0];
        var j = d.createElement(s);
        var dl = l !== "dataLayer" ? "&l=" + l : "";

        j.async = true;
        j.src =
          "https://www.googletagmanager.com/gtm.js?id=" +
          i +
          dl;

        f.parentNode.insertBefore(j, f);
      })(window, document, "script", "dataLayer", "GTM-5XP4GMDV");

      // Google Analytics
      var gaScript = document.createElement("script");

      gaScript.async = true;
      gaScript.src =
        "https://www.googletagmanager.com/gtag/js?id=G-3DV6ZX6W9M";

      document.head.appendChild(gaScript);

      window.dataLayer = window.dataLayer || [];

      function gtag() {
        window.dataLayer.push(arguments);
      }

      window.gtag = gtag;

      gtag("js", new Date());
      gtag("config", "G-3DV6ZX6W9M");
    })();
  </script>

  <!-- SPA Redirect Handling -->
  <script>
    (function (l) {
      if (l.search[1] === "/") {
        var decoded = l.search
          .slice(1)
          .split("&")
          .map(function (s) {
            return s.replace(/~and~/g, "&");
          })
          .join("?");

        window.history.replaceState(
          null,
          null,
          l.pathname.slice(0, -1) + decoded + l.hash
        );
      }
    })(window.location);
  </script>
